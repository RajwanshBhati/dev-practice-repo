<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATS — Login</title>
  <link rel="stylesheet" href="../styles/auth.css" />
</head>
<body>

  <div class="auth-wrapper">

    <!-- Left Panel -->
    <div class="auth-left">
      <div class="brand">
        <div class="brand-icon">ATS</div>
        <h1>Interview Tracking System</h1>
        <p>Streamline your hiring process from profiling to final selection.</p>
      </div>
      <div class="feature-list">
        <div class="feature-item">
          <span class="feature-dot"></span>
          <span>Manage Job Descriptions</span>
        </div>
        <div class="feature-item">
          <span class="feature-dot"></span>
          <span>Track Candidate Progress</span>
        </div>
        <div class="feature-item">
          <span class="feature-dot"></span>
          <span>Schedule L1 & L2 Interviews</span>
        </div>
        <div class="feature-item">
          <span class="feature-dot"></span>
          <span>Collect Panel Feedback</span>
        </div>
      </div>
    </div>

    <!-- Right Panel — Login Form -->
    <div class="auth-right">
      <div class="auth-card">

        <div class="auth-header">
          <h2>Welcome back</h2>
          <p>Sign in to your account to continue</p>
        </div>

        <!-- Alert Box -->
        <div class="alert" id="alert-box" style="display:none;">
          <span class="alert-icon" id="alert-icon">!</span>
          <span id="alert-message"></span>
        </div>

        <form id="login-form" novalidate>

          <div class="form-group">
            <label for="email">Email address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1
                           0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="hr@company.com"
                autocomplete="email"
                required
              />
            </div>
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">
              Password
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-password" id="toggle-password"
                      aria-label="Toggle password visibility">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn-primary" id="login-btn">
            <span id="btn-text">Sign in</span>
            <span id="btn-loader" class="btn-loader" style="display:none;">
              <span class="spinner"></span>
              Signing in...
            </span>
          </button>

        </form>

        <div class="auth-footer">
          <p>Panel member? <a href="activate.html">Set up your account</a></p>
        </div>

      </div>
    </div>

  </div>

  <script src="../scripts/auth.js"></script>
</body>
</html>
