<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS — Login</title>
    <link rel="stylesheet" href="../styles/auth.css" />
    <link rel="stylesheet" href="../styles/base/base.css"/>
  </head>
 <body>

<div class="top-nav">
  <a href="../index.html" class="home-btn">Back</a>
</div>


  <div class="login-page">
    <section class="login-left">
      <div class="brand">TalentBridge</div>

      <h1>Welcome back</h1>
      <p>
        Login to manage your hiring workflow, track applications, and continue your interview process.
      </p>

      <ul>
        <li>View job applications</li>
        <li>Track interview status</li>
        <li>Manage feedback easily</li>
      </ul>
    </section>

    <section class="login-card">
      <h2>Login</h2>
      <p class="subtitle">Enter your account details</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter email" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>

        <button type="submit" id="login-btn" class="login-btn">Login</button>

        <p id="loginMessage" class="message"></p>
      </form>

      <p class="register-text">
        New candidate?
        <a href="candidate_register.html">Register here</a>
      </p>
    </section>
  </div>

  <script type="module" src="../scripts/pages/login.js"></script>
</body>
</html>
