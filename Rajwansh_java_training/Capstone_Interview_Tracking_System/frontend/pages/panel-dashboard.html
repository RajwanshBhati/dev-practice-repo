<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Dashboard</title>

    <link rel="stylesheet" href="../styles/panel-dashboard.css" />
    <link rel="stylesheet" href="../styles/base/base.css" />
  </head>

  <body>
    <main class="panel-dashboard-page">
    <button class="panel-back-btn" onclick="history.back()">← Back</button>

    <section class="panel-section">
      <div class="page-header">
        <div>
          <h1>Panel Dashboard</h1>
          <p id="assign">Assigned Interviews</p>
        </div>
      </div>

      <div class="panel-table-wrapper">
        <table class="panel-table">
          <thead>
            <tr>
              <th>Candidate</th>
              <th>Email</th>
              <th>Mobile</th>
              <th>Stage</th>
              <th>Date</th>
              <th>Time</th>
              <th>Focus Area</th>
              <th>Resume</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="panel-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Submit Feedback</h2>
      <button type="button" class="modal-close" onclick="closeFeedback()">×</button>
    </div>

    <form id="feedback-form" class="feedback-form">
      <textarea id="feedback-comments" placeholder="Comments"></textarea>

      <div class="feedback-grid">
        <input id="feedback-strength" type="text" placeholder="Strengths" />
        <input id="feedback-weakness" type="text" placeholder="Weakness" />
      </div>

      <div class="feedback-grid">
        <select id="feedback-rating">
          <option value="1">Rating: 1</option>
          <option value="2">Rating: 2</option>
          <option value="3">Rating: 3</option>
          <option value="4">Rating: 4</option>
          <option value="5">Rating: 5</option>
        </select>

        <select id="feedback-status">
          <option value="SELECTED">Selected</option>
          <option value="REJECTED">Rejected</option>
          <option value="HOLD">Hold</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-submit-feedback" onclick="submitFeedback()">Submit</button>
        <button type="button" class="btn-cancel-feedback" onclick="closeFeedback()">Cancel</button>
      </div>
    </form>
  </div>
</div>
    <div id="toast-container"></div>
    <!-- JS -->
    <script type="module" src="../scripts/pages/panel-main.js"></script>
  </body>
</html>
