<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Jobs | TalentBridge</title>
  <link rel="stylesheet" href="../styles/candidate.css" />
</head>
<body class="dashboard-body">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="candidate-dashboard.html" class="nav-brand">
      <span class="logo-icon">⬡</span> TalentBridge
    </a>
    <div class="nav-right">
      <a href="candidate-status.html" class="nav-status-link">📋 My Application</a>
      <div class="nav-user">
        <div class="nav-avatar" id="avatarInitial">?</div>
        <span id="userName"></span>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="page-container">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1>Open Positions</h1>
        <p>Find your next opportunity — apply with one click</p>
      </div>
    </div>

    <!-- Application Banner  -->
    <div id="appBanner" class="app-banner hidden"></div>

    <!-- Filters -->
    <div class="filters-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍  Search by title, skills, location…" />
      <select id="filterType" class="filter-select">
        <option value="">All Types</option>
        <option value="Full-Time">Full-Time</option>
        <option value="Contract">Contract</option>
        <option value="Remote">Remote</option>
      </select>
    </div>

    <!-- JD Grid -->
    <div id="loader" class="loader">
      <div class="loader-spinner">⟳</div>
      <p style="margin-top:12px">Loading jobs…</p>
    </div>
    <div id="noJobs" class="no-jobs hidden">
      <p style="font-size:32px">📭</p>
      <p style="margin-top:8px">No open positions right now. Check back soon!</p>
    </div>
    <div id="jdGrid" class="jd-grid"></div>

  </div>

  <!-- ── Apply / Profiling Modal -->
  <div id="applyModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2>Apply for Position</h2>
          <div class="modal-job-name" id="modalJobTitle"></div>
        </div>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>

      <div id="formError"   class="alert alert-error   hidden"></div>
      <div id="formSuccess" class="alert alert-success hidden"></div>

      <form id="profilingForm" class="modal-form" novalidate>
        <input type="hidden" id="modalJobId" />

        <!-- Personal Info -->
        <div class="form-section">
          <div class="section-label">Personal Information</div>
          <div class="form-row">
            <div class="form-group">
              <label>Full Name <span class="req">*</span></label>
              <input type="text" id="pFullName" placeholder="John Doe" required />
            </div>
            <div class="form-group">
              <label>Email ID <span class="req">*</span></label>
              <input type="email" id="pEmail" placeholder="john@example.com" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Mobile Number <span class="req">*</span></label>
              <div class="phone-input">
                <select id="pMobileCode">
                  <option value="+91">🇮🇳 +91</option>
                  <option value="+1">🇺🇸 +1</option>
                  <option value="+44">🇬🇧 +44</option>
                  <option value="+61">🇦🇺 +61</option>
                  <option value="+971">🇦🇪 +971</option>
                </select>
                <input type="tel" id="pMobile" placeholder="9876543210" required />
              </div>
            </div>
            <div class="form-group">
              <label>Date of Birth <span class="opt">(optional)</span></label>
              <input type="date" id="pDob" />
            </div>
          </div>
        </div>

        <!-- Professional Info -->
        <div class="form-section">
          <div class="section-label">Professional Details</div>
          <div class="form-row">
            <div class="form-group">
              <label>Current Organisation <span class="req">*</span></label>
              <input type="text" id="pCurrentOrg" placeholder="Acme Corp" required />
            </div>
            <div class="form-group">
              <label>Preferred Location <span class="req">*</span></label>
              <input type="text" id="pPreferredLocation" placeholder="Pune / Remote" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Total Experience (yrs) <span class="req">*</span></label>
              <input type="number" id="pTotalExp" placeholder="5" min="0" max="50" required />
            </div>
            <div class="form-group">
              <label>Relevant Experience (yrs) <span class="req">*</span></label>
              <input type="number" id="pRelevantExp" placeholder="3" min="0" max="50" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Current CTC <span class="req">*</span></label>
              <input type="text" id="pCurrentCTC" placeholder="₹ 8,00,000" required />
            </div>
            <div class="form-group">
              <label>Expected CTC <span class="req">*</span></label>
              <input type="text" id="pExpectedCTC" placeholder="₹ 12,00,000" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Notice Period (days) <span class="req">*</span></label>
              <select id="pNoticePeriod" required>
                <option value="">Select</option>
                <option value="0">Immediate / Serving</option>
                <option value="15">15 days</option>
                <option value="30">30 days</option>
                <option value="45">45 days</option>
                <option value="60">60 days</option>
                <option value="90">90 days</option>
              </select>
            </div>
            <div class="form-group">
              <label>Source <span class="req">*</span></label>
              <select id="pSource" required>
                <option value="">How did you hear about us?</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Naukri">Naukri</option>
                <option value="Referral">Employee Referral</option>
                <option value="Company Website">Company Website</option>
                <option value="Job Fair">Job Fair</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Resume -->
        <div class="form-section">
          <div class="section-label">Resume</div>
          <div class="form-group">
            <label class="file-upload-label">
              <span class="file-upload-icon">📎</span>
              <span id="resumeLabel">Click to upload resume (PDF / DOC / DOCX)</span>
              <input type="file" id="pResume" accept=".pdf,.doc,.docx" onchange="handleResumeChange(this)" />
            </label>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitProfilingBtn">
          Submit Application
        </button>
      </form>
    </div>
  </div>


  <script src="js/config.js"></script>
  <script src="js/candidate-dashboard.js"></script>
  <script src="../scripts/candidate/avatar.js"></script>
</body>
</html>
