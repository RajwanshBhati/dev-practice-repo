<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Candidates</title>

    <!-- Styles -->
     <link rel="stylesheet" href="../styles/theme-polish.css" />
    <link rel="stylesheet" href="../styles/hr-candidate.css" />

  </head>

  <body>
    <section class="candidate-section">
      <div class="page-header">
        <div class="page-header-left">
          <h1>Candidates</h1>
          <p>Review candidate applications and manage interview rounds</p>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrapper">
          <input
            type="text"
            id="candidate-search-input"
            placeholder="Search by name, email, company or JD"
          />
        </div>

        <select id="candidate-stage-filter" class="filter-select">
          <option value="">All Stages</option>
          <option value="PROFILING">Profiling</option>
          <option value="SCREENING">Screening</option>
          <option value="L1_TECHNICAL">L1 Technical</option>
          <option value="L2_TECHNICAL">L2 Technical</option>
          <option value="HR_ROUND">HR Round</option>
          <option value="REJECTED">Rejected</option>
          <option value="SELECTED">Selected</option>
        </select>
      </div>

      <!-- Candidate Table -->
<div id="candidate-container" class="candidate-grid"></div>

        <!-- Schedule Modal -->
        <div class="modal-overlay" id="schedule-modal" style="display: none">
          <div class="modal-box">
            <div class="modal-header">
              <h2>Schedule Interview</h2>
              <button type="button" id="schedule-modal-close">×</button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="schedule-candidate-id" />
              <input type="hidden" id="schedule-stage" />

              <label>Interview Date</label>
              <input type="date" id="interview-date" />

              <label>Interview Time</label>
              <input type="time" id="interview-time" />

              <label>Select Panel Members</label>
              <select id="panel-select" multiple></select>

              <small>Select minimum 1 and maximum 2 panel members.</small>

              <label>Focus Areas</label>
              <textarea id="focus-areas" rows="4"></textarea>
            </div>

            <div class="modal-footer">
              <button type="button" id="schedule-cancel-btn">Cancel</button>
              <button type="button" id="schedule-submit-btn">Schedule</button>
            </div>
          </div>
        </div>
        <!-- Empty state -->
        <div
          class="empty-state"
          id="candidate-empty-state"
          style="display: none"
        >
          <h3>No candidates found</h3>
          <p>
            Candidate applications will appear here after they apply for a JD.
          </p>
        </div>

        <!-- Loader -->
        <div class="table-loader" id="candidate-table-loader">
          <div class="spinner-standalone"></div>
          <p>Loading candidates...</p>
        </div>
    </section>
    <div id="toast-container"></div>
    <!-- JS -->
    <script type="module" src="../scripts/pages/hr-main.js"></script>
  </body>
</html>
