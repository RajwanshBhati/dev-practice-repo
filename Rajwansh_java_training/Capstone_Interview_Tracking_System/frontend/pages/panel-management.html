<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Management</title>

    <link rel="stylesheet" href="../styles/panel.css" />
    <link rel="stylesheet" href="../styles/base/base.css" />
    <link rel="stylesheet" href="../styles/theme-polish.css" />
  </head>

  <body>
    <div class="panel-container">
      <!-- Create Panel -->
      <div class="panel-card">
        <h2>Create Panel Member</h2>

        <form id="panel-form" class="panel-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label>Mobile</label>
            <input type="text" id="mobile" />
          </div>

          <div class="form-group">
            <label>Organization</label>
            <input type="text" id="organization" />
          </div>

          <div class="form-group full-width">
            <label>Designation</label>
            <input type="text" id="designation" />
          </div>

          <div class="full-width">
            <button class="btn-create" type="submit">Create Panel</button>
          </div>
        </form>
      </div>

      <!-- Panel List -->
      <div class="panel-card">

        <div class="panel-table-wrapper">
          <table class="panel-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Organization</th>
                <th>Designation</th>
              </tr>
            </thead>
            <tbody id="panel-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="../scripts/candidate/panel.js"></script>
  </body>
</html>
