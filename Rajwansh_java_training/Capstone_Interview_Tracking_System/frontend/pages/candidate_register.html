<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - TalentBridge</title>
  <link rel="stylesheet" href="../styles/register.css" />
</head>

<body>

<a href="../index.html" class="floating-home">Back</a>

<main class="register-page">

  <!-- LEFT SIDE -->
  <section class="register-left">
    <h1>Create your profile</h1>
    <p>
      Register once, apply for jobs, track your interview stages and manage your career journey.
    </p>
  </section>

  <!-- RIGHT CARD -->
  <section class="register-card">
    <h2>Candidate Register</h2>
    <p class="subtitle">Fill your details</p>

    <form id="registerForm">

      <div class="form-grid">

        <div class="form-group full">
          <label>Full Name</label>
          <input type="text" id="name" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="mobileNumber" maxlength="10" required />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required />
        </div>

      </div>

      <button type="submit" id="registerBtn" class="register-btn">Create Account</button>
<p id="msg"></p>

    </form>

    <p class="login-link">
      Already registered?
      <a href="login.html">Login here</a>
    </p>

  </section>

</main>

<script type="module" src="../scripts/services/candidate_register.js"></script>

</body>
</html>
