<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Inventory</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <h1 class="logo">
          <i class="fa-brands fa-product-hunt"></i>Product Inventory Management
        </h1>
      <button id="addProductBtn" class="add-btn">
      + Add Product
    </button>
      </div>
    </header>

    <section class="filters-section container">
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search products..." />
        <i class="fas fa-search lol"></i>
      </div>
      <div class="filter-group">
        <select id="categoryFilter">
          <option value="">All Categories</option>
        </select>
        <select id="sortFilter">
          <option value="">Sort</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="Atoz">Name:A to Z</option>
          <option value="ZtoA">Name: Z to A</option>
        </select>
      </div>
    </section>

    <section class="analytics">
      <div>Total Products: <span id="totalProducts">0</span></div>
      <div>Total Value: ₹<span id="totalValue">0</span></div>
      <div>Out of Stock: <span id="outOfStock">0</span></div>
    </section>

    <main class="main container">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <!-- <p>Loading products...</p> -->
      </div>
      <div id="productsGrid" class="products-grid"></div>
      <div id="pagination" class="pagination"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
